# Configuration des groupes d'API
springdoc.group-configs[0].group=user-management
springdoc.group-configs[0].display-name=User Management
springdoc.group-configs[0].paths-to-match=/api/users/**

springdoc.group-configs[1].group=authentication
springdoc.group-configs[1].display-name=Authentication
springdoc.group-configs[1].paths-to-match=/api/auth/**

springdoc.group-configs[2].group=product-management
springdoc.group-configs[2].display-name=Product Management
springdoc.group-configs[2].paths-to-match=/api/products/**

springdoc.group-configs[3].group=public
springdoc.group-configs[3].display-name=Public APIs
